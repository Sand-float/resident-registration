}

}

 const field=document.querySelector('#profile-id');
 if(!field)return false;
 const id=field.value.trim();
 const count=Array.from(id).length;
 const okay=validId(id);
 const label=document.querySelector('#profile-tip');
 document.querySelector('#profile-count').textContent=`${count}/4`;
 label.classList.toggle('invalid',count>0&&!okay);
 label.textContent=count===0?'支持简体、繁体，最多 4 个汉字。':okay?'这个 ID 可以使用。':count>4?'ID 最多只能输入 4 个汉字。':'ID 只能使用中文汉字（支持繁体）。';
 document.querySelector('#profile-continue').disabled=!(okay&&state.avatar>=1&&state.avatar<=3);
 return okay;
}

 store();go('chapter');
}

 }
 state.page=p;store();render();
}
function goBack(){
 const previous=(Array.isArray(state.navStack)?state.navStack:[]).pop();
 state.page=previous||'home';store();render();
}
function goHome(){state.navStack=[];state.page='home';store();render()}
function setTheme(next){
 if(next!=='light'&&next!=='dark')return;
 state.theme=next;store();render();
}
function openApp(a){const pages={'微信':'wechat','相册':'gallery','电话':'phone','短信':'sms','备忘录':'notes','物业服务':'property','设置':'settings'};go(pages[a])}
function advance(){state.stage=Math.max(state.stage+1,1);store();render()}
function foundMember(){state.stage=Math.max(state.stage,2);goBack();notify('获得线索：不存在的群成员')}
function reply(){state.reply=true;state.stage=3;state.trust-=9;store();render()}
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function reset(){const theme=state.theme;Object.assign(state,defaultState,{navStack:[],theme});store();render()}
document.querySelector('#home-gesture').addEventListener('click',goHome);
render();


</script>
</body>
</html>
