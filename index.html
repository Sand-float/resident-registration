/* Resident Registration · visual revision */
.cover-game.title-cover{justify-content:center;background:radial-gradient(circle at 80% 15%,#6d5865 0%,transparent 37%),linear-gradient(165deg,#2d2931 0%,#51444c 72%,#806d79 100%)}
.title-cover .cover-supra{margin-bottom:54px;letter-spacing:.35em}
.title-cover .game-title{margin:0;font-size:42px;font-weight:440;letter-spacing:.16em;text-indent:.16em;line-height:1.4}
.title-cover .game-title-rule{height:1px;background:#dbcbd096;width:35px;margin:30px auto 20px}
.title-cover .game-brief{font-size:12px;color:#ddcfd4;line-height:2.1;letter-spacing:.04em}
.title-cover .title-start{margin-top:76px;border:1px solid #e2cbd5;background:#ebd9de;color:#423640;border-radius:7px;padding:16px 35px;width:min(100%,250px);font-weight:600;font-size:14px;letter-spacing:.11em;transition:transform .15s}
.title-cover .title-start:active{transform:scale(.98)}
.title-cover small{margin-top:25px}
.profile-screen{height:100%;width:100%;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(157deg,#f9f4f1,#f0e3e6 70%,#e7d7df);color:#4b4149}
.profile-content{padding:72px 27px 42px;min-height:100%;display:flex;flex-direction:column;align-items:stretch}
.profile-kicker{font-size:10px;color:#977f8d;letter-spacing:.21em;font-weight:600}
.profile-content h1{font-size:29px;font-weight:500;margin:16px 0 7px;letter-spacing:.07em}
.profile-desc{font-size:12px;color:#97858d;margin:0 0 27px;line-height:1.85}
.profile-label{font-size:13px;color:#65535e;font-weight:600;margin:0 0 12px}
.avatar-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:29px}
.avatar-choice{border:1px solid #dacdd2;border-radius:13px;padding:12px 5px 10px;background:#ffffff7a;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;color:#6c6267;transition:background .15s,border-color .15s,transform .15s}
.avatar-choice.selected{background:#fff;border:2px solid #a07991;padding:11px 4px 9px;box-shadow:0 6px 15px #b5929d26;color:#423b43}
.avatar-choice:active{transform:scale(.98)}
.avatar-choice b{font-size:12px;font-weight:600}
.avatar-choice small{font-size:10px;color:#aa9da3}
.avat-portrait{width:62px;height:62px;position:relative;overflow:hidden;border-radius:50%;background:#d5b8c0;display:block}
.avat-portrait:before{content:"";position:absolute;left:23px;top:14px;width:16px;height:17px;background:#fff9;border-radius:50%}
.avat-portrait:after{content:"";position:absolute;left:12px;bottom:3px;width:38px;height:25px;background:#fff9;border-radius:55% 55% 36% 36%}
.avat-portrait.av2{background:#98bcb7}.avat-portrait.av3{background:#b5a4cb}
.avat-portrait.sm{height:35px;width:35px}.avat-portrait.sm:before{left:13px;top:7px;width:10px;height:11px}.avat-portrait.sm:after{left:7px;bottom:1px;width:22px;height:15px}
.avat-portrait.lg{width:62px;height:62px}
.profile-field{border:1px solid #dac9d1;border-radius:11px;padding:0 12px;background:#fff;display:flex;align-items:center;height:54px}
.profile-field input{min-width:0;flex:1;border:0;background:transparent;outline:0;font-size:16px;color:#4a3c43;letter-spacing:.03em}
.profile-field .count{font-size:11px;color:#a19aa1;white-space:nowrap}
.profile-tip{font-size:11px;color:#998b93;min-height:21px;margin:8px 1px 22px;line-height:1.65}
.profile-tip.invalid{color:#c25d70}
.profile-continue{margin-top:auto;background:#54414e;border-radius:9px;color:#fff;font-weight:600;letter-spacing:.1em;padding:15px 12px;min-height:52px;font-size:14px;box-shadow:0 7px 20px #90798523}
.profile-continue:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.profile-footnote{text-align:center;color:#a99ba4;font-size:10px;margin-top:14px;line-height:1.7}
.cover-game.chapter{position:relative;align-items:flex-start;justify-content:center;text-align:left;padding:0 40px 0;background:linear-gradient(160deg,#292d39,#4f4f5a)}
.chapter .day-date{font-size:12px;letter-spacing:.18em;color:#bbbcc7;margin-top:10px}
.chapter .chapter-rule{width:39px;height:1px;background:#bfc1c7;opacity:.6;margin:30px 0 0}
.chapter .chapter-continue{position:absolute;right:28px;bottom:max(43px,calc(30px + env(safe-area-inset-bottom)));padding:12px 0 12px 16px;color:#ebdee4;background:transparent;border:0;border-radius:0;box-shadow:none;font-size:13px;letter-spacing:.11em;display:flex;align-items:center;gap:9px}
.chapter .chapter-continue span{font-size:21px;font-weight:300;transition:transform .2s}
.chapter .chapter-continue:active span{transform:translateX(5px)}
.cover-game.scene{align-items:stretch;justify-content:space-between;background:linear-gradient(165deg,#292f37,#35333b 64%,#50434b);text-align:left;padding:105px 32px 53px}
.scene .scene-top small{font-size:11px;letter-spacing:.24em;color:#ad9eaa}
.scene .scene-top h2{font-size:23px;font-weight:400;line-height:1.55;letter-spacing:.05em;margin:28px 0 24px}
.scene .scene-top p{color:#d9d1d7;font-size:13px;line-height:2.35;margin:0;max-width:290px}
.scene .phone-view-cta{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 20px;background:transparent;color:#f8eff3;border:1px solid #bcaab7;border-radius:3px;letter-spacing:.12em;font-size:14px}
.scene .phone-view-cta span{font-size:22px;line-height:1}
.scene .phone-view-cta:active{background:#fff2}
@media(max-height:680px){.profile-content{padding-top:54px}.profile-desc{margin-bottom:16px}.avatar-choices{margin-bottom:17px}.avat-portrait{width:52px;height:52px}.avat-portrait:before{left:19px;top:11px}.avat-portrait:after{left:10px;width:33px}}

/* Resident Registration · coherent mobile interface v3.
   Independent implementation: spacing/legibility inspired by general mobile UI standards,
   no reference game CSS, branding or imagery reused. */

 --border:#e9e5eb; --stroke:#ebe7ed; --accent:#907a91;

 --bubble-mine:#d2e8d7; --danger:#df6374;

 --border:#34353f; --stroke:#383944; --accent:#c4acbf;
 --ui-top:#23242c; --chat-bg:#191a22; --bubble:#2c2d37;
 --bubble-mine:#355a4a; --danger:#e45e73;
}

<body>
  <div class="outer">
    
    <main class="phone" id="phone" aria-label="模拟手机游戏">
      <div class="camera-pill" aria-hidden="true"></div>
      <div class="phone-screen" id="phone-screen">
        <header class="statusbar" id="statusbar"><span id="status-time">20:16</span><div class="status-icons"><svg viewBox="0 0 24 16" width="21" height="14"><path d="M1 14h3V9H1zm5 0h3V6H6zm5 0h3V3h-3zm5 0h3V0h-3z" fill="currentColor"/></svg><svg viewBox="0 0 20 16" width="20" height="14"><path d="M1 5C6 0 14 0 19 5L17 7C13 3 7 3 3 7zM5 9c3-3 7-3 10 0l-2 2c-2-2-4-2-6 0zm5 6-2-2c1.1-1.3 2.9-1.3 4 0z" fill="currentColor"/></svg><svg viewBox="0 0 28 14" width="27" height="14"><rect x="1" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="3.5" y="3.5" width="17" height="7" rx="1.5" fill="currentColor"/><rect x="25" y="5" width="2" height="4" rx="1" fill="currentColor"/></svg></div></header>
        <div id="view" class="view"><div class="cover-game"><h1>正在进入游戏</h1><p>如果画面长时间停留在这里，请换用 Chrome 或 Edge 打开。</p></div></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="overlay-root"></div>
        <button class="home-gesture" id="home-gesture" aria-label="返回桌面"><span></span></button>
      </div>
    </main>
    
  </div>
  <script>

const view=document.querySelector('#view'), overlay=document.querySelector('#overlay-root');
const defaultState={page:'intro',day:1,stage:0,checked:false,reply:false,replyChoice:0,stress:8,trust:70,clues:0,tab:'微信',playerId:'',avatar:0,profileDraft:'',theme:'dark',navStack:[],messageSpeed:2200,seenAnnouncement:false,yutongStage:0,groupReadStage:0,neighborReadStage:0};
let storedState={};
try{storedState=JSON.parse(localStorage.getItem('resident_register_v1')||'{}')||{}}catch(e){}
const state={...defaultState,...storedState,page:'intro',navStack:[],phoneActivated:false};
let hasSavedTheme=false;try{hasSavedTheme=!!localStorage.getItem('resident_theme_set_v8')}catch(e){}
state.theme=hasSavedTheme? (state.theme==='light'?'light':'dark') : 'dark';
state.messageSpeed=([700,1600,3000].includes(state.messageSpeed)?{700:1000,1600:2200,3000:3600}[state.messageSpeed]:state.messageSpeed); state.messageSpeed=[1000,2200,3600].includes(state.messageSpeed)?state.messageSpeed:2200;
let narrativeTimer=null, bannerTimer=null, neighborTimer=null;
function cancelNarrative(){if(narrativeTimer){clearTimeout(narrativeTimer);narrativeTimer=null}if(neighborTimer){clearTimeout(neighborTimer);neighborTimer=null}}
function groupMessageCount(){return Math.max(0,Math.min(7,Number(state.stage)||0))}
function neighborMessageCount(){
 const s=Number(state.yutongStage)||0;
 let c=0;
 if(s>=1)c++;
 if(s>=2)c++;
 if(s>=4)c++;
 if(s>=5)c++;
 return c;
}
function unreadGroupCount(){return Math.max(0,groupMessageCount()-(Number(state.groupReadStage)||0))}
function unreadNeighborCount(){return Math.max(0,neighborMessageCount()-(Number(state.neighborReadStage)||0))}
function totalWechatUnread(){return unreadGroupCount()+unreadNeighborCount()}
function markGroupRead(){state.groupReadStage=groupMessageCount();store()}
function markNeighborRead(){state.neighborReadStage=neighborMessageCount();store()}
function isViewingTarget(target){
 if(target==='chat')return ['chat','members','rules'].includes(state.page);
 if(target==='neighbor')return state.page==='neighbor';
 return state.page===target;
}
function advanceGroupMessage(){
 if(!state.phoneActivated)return;
 if(state.stage>=7)return;
 if(state.stage===3 && !state.seenAnnouncement)return;
 if(state.stage===6 && !state.checked)return;
 state.stage=Math.min(7,(Number(state.stage)||0)+1);
 if(state.page==='chat')state.groupReadStage=groupMessageCount();
 store();
 if(!isViewingTarget('chat'))banner(state.stage===1?T('公告标题'):T('群聊'+state.stage+'正文'), state.stage===1?E('业主群名称'):T('群聊'+state.stage+'发言人'),'chat');
 render();
 scheduleGroupNarrative();
}
function scheduleGroupNarrative(){
 if(narrativeTimer){clearTimeout(narrativeTimer);narrativeTimer=null}
 if(!state.phoneActivated || state.reply || state.stage>=7)return;
 if(state.stage===3 && !state.seenAnnouncement)return;
 if(state.stage===6 && !state.checked)return;
 const ms=state.stage===0?Math.max(Number(state.messageSpeed)||2200, (Number(state.phoneStartAt)||Date.now())+3600-Date.now()):Math.max(700,Number(state.messageSpeed)||2200);
 narrativeTimer=setTimeout(advanceGroupMessage,ms);
}
function advanceNeighborMessage(){
 if(!state.phoneActivated)return;
 const current=Number(state.yutongStage)||0;
 if(![1,3,4].includes(current))return;
 state.yutongStage=current+1;
 if(state.page==='neighbor')state.neighborReadStage=neighborMessageCount();
 let key=state.yutongStage===2?'王雨桐新消息2':state.yutongStage===4?'王雨桐后续消息1':'王雨桐后续消息2';
 store();
 if(!isViewingTarget('neighbor'))banner(T(key),'王雨桐','neighbor');
 render();
 scheduleNeighborNarrative();
}
function scheduleNeighborNarrative(){
 if(neighborTimer){clearTimeout(neighborTimer);neighborTimer=null}
 if(!state.phoneActivated || ![1,3,4].includes(Number(state.yutongStage)||0))return;
 neighborTimer=setTimeout(advanceNeighborMessage, Math.max(700,Number(state.messageSpeed)||2200));
}
function banner(message,from='微信',target='chat'){
 if(!state.phoneActivated || ['intro','warning','profile','chapter','scene'].includes(state.page) || isViewingTarget(target))return;
 const old=document.getElementById('incoming-banner');if(old)old.remove();
 const b=document.createElement('button');b.id='incoming-banner';b.className='incoming-banner';
 const summary=String(message||'').replace(/\s+/g,' ').slice(0,64);
 b.innerHTML='<b><span>'+clean('微信 · '+from)+'</span><span class="banner-time">20:16</span></b><span>'+clean(summary)+'</span>';
 b.onclick=()=>{b.remove();go(target)};
 document.querySelector('.phone-screen').appendChild(b);
 clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>{if(b.isConnected)b.remove()},Math.max(5200,Math.min(9000,(Number(state.messageSpeed)||1600)*3.2)));
}
// The profile form starts with the previous chosen ID, but allows editing it.
state.profileDraft=state.playerId||'';
const store=()=>{try{localStorage.setItem('resident_register_v1',JSON.stringify(state))}catch(e){}};

// 所有可编辑剧情文案都放在同目录的 story.txt。
const story=Object.create(null);
function parseStory(source){
  const found=Object.create(null);let key=null;let chunk=[];
  function save(){if(key!==null)found[key]=chunk.join('\n').trim()}
  for(const raw of source.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n')){
    const match=raw.trim().match(/^【(.+?)】$/);
    if(match){save();key=match[1].trim();chunk=[];continue}
    if(key!==null && !raw.trim().startsWith('#'))chunk.push(raw);
  }
  save();return found;
}
function T(key){return story[key]||''}
function E(key){return clean(T(key))}
function L(key){return E(key).replace(/\n/g,'<br>')}
function storyMsg(i,cls){return msg(T('群聊'+i+'发言人'),i===1?T('公告正文'):T('群聊'+i+'正文'),cls)}
function installStory(source){
  const parsed=parseStory(source);
  if(!parsed['游戏名称']||!parsed['公告正文'])throw new Error('story.txt 缺少游戏名称或公告正文');
  for(const key in story)delete story[key];
  Object.assign(story,parsed);
  document.title=T('游戏名称')+' · Day 1 互动预览';
  // 手机优先：桌面侧边信息不再显示。
  render();
  scheduleGroupNarrative();
  scheduleNeighborNarrative();
}
function showStoryPicker(error){
  document.querySelector('#view').innerHTML=`<div class="cover-game warning"><div class="cover-supra">STORY FILE</div><h1 style="font-size:26px">加载剧情文字</h1><p>${location.protocol==='file:'?'浏览器不允许直接读取本地 TXT 文件。请选择与 index.html 放在一起的 story.txt 文件。':'暂时无法自动读取 story.txt，请确认文件已经上传至 GitHub 仓库根目录，或在此手动选择文件。'}</p><label class="primary" style="cursor:pointer;display:block;padding:14px 18px;border-radius:8px">选择 story.txt<input type="file" accept=".txt,text/plain" style="display:none" onchange="importStoryFile(this)"></label><small>${clean(String(error?.message||''))}</small></div>`;
}
async function importStoryFile(input){
  if(!input.files||!input.files.length)return;
  try{installStory(await input.files[0].text())}
  catch(e){showStoryPicker(e)}
}
async function loadStory(){
  try{
    const r=await fetch(new URL('story.txt',location.href),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    installStory(await r.text());
  }catch(e){showStoryPicker(e)}
}

const avatarMark=(slot,small=false)=>{
 const pal=[['#e9c7d1','#fff8fb'],['#a6d2c8','#f9fffe'],['#c6bfdf','#fffaff']][Math.max(0,Math.min(2,(Number(slot)||1)-1))];
 return `<svg class="avat-portrait ${small?'sm':'lg'}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="玩家头像"><rect width="100" height="100" rx="16" fill="${pal[0]}"/><circle cx="50" cy="36" r="16" fill="${pal[1]}"/><path d="M20 92 C20 73 33 61 50 61 C67 61 80 73 80 92 V100 H20Z" fill="${pal[1]}"/></svg>`;

const clean=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 文本档案：姓名|好友/未添加|个性签名|朋友圈内容
function personKey(name){
 const raw=String(name||'').trim();
 if(raw==='物业通知')return '物业通知';
 if(raw.includes('玩家姓名')||raw===state.playerId||raw==='我')return '我';
 if(raw.includes('米米')||raw.includes('闺闺'))return '米米';
 if(raw.includes('刘芳'))return '刘芳';
 if(raw.includes('小林'))return '小林';
 return raw.replace(/^[（(]?\d{3}[）)]?[-－\s]*/, '').trim();
}
function people(){
 const dict=Object.create(null);
 T('人物档案').split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{
   const a=line.split('|');dict[a[0].trim()]={friend:(a[1]||'').trim()==='好友',bio:(a[2]||'').trim(),moment:(a.slice(3).join('|')||'').trim()};
 });return dict;
}
function getPerson(name){
 const key=personKey(name);const meta=people()[key]||{friend:false,bio:'',moment:''};
 return {key,display:String(name||key).replace('玩家姓名',state.playerId||'我'),...meta,friend:key==='我'||meta.friend};
}
const personHue=name=>{let h=0;for(const c of String(name))h=(h*31+c.codePointAt(0))%360;return `hsl(${h},25%,67%)`};
function navTabIcon(label){
 const paths={
 '微信':'<path d="M4 6h16v10H9l-5 4V6Z"/><path d="M8 10h8"/>',
 '通讯录':'<circle cx="12" cy="8" r="3"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>',
 '发现':'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-4 1 2-6z"/>',
 '我':'<circle cx="12" cy="8" r="3"/><path d="M6 20c0-4 2-6 6-6s6 2 6 6"/>'};
 return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[label]+'</svg>';
}
function personAvatar(name,size='sm'){
 const p=getPerson(name);const black=p.key==='物业通知';
 return `<span class="avatar ${size} ${p.key==='我'?'self-av':''}" style="background:${black?'#050505':personHue(p.key)}">${black?'':p.key==='我'?avatarMark(state.avatar,size!=='lg'):clean(p.key.slice(0,1))}</span>`;
}
function profileButton(name,size='sm'){
 return `<button class="avatar-tap" title="查看${clean(name)}的资料" aria-label="查看${clean(name)}的资料" onclick="openPerson('${encodeURIComponent(name)}')">${personAvatar(name,size)}</button>`;
}
function openPerson(encoded){state.person=decodeURIComponent(encoded);go('contact-profile')}
function openDirect(encoded){
 const raw=decodeURIComponent(encoded);const person=getPerson(raw);
 if(!person.friend){notify('你们还不是微信好友');return}
 state.dmPerson=person.key;
 if(person.key==='王雨桐')go('neighbor');else go('direct-chat');
}
function openPersonMoments(){
 if(!getPerson(state.person).friend){notify('仅好友可查看朋友圈');return}
 go('contact-moments');
}
function sendFriendRequest(){notify('好友申请已发送，等待对方通过');}
function chatTranscript(key){
 const section=key==='妈妈'?'微信妈妈聊天':key==='米米'?'微信闺蜜聊天':key==='刘芳'?'微信房东聊天':key==='小林'?'微信物业聊天':'';
 return T(section).split('\n').filter(Boolean).map(line=>{
   const idx=line.indexOf('：');const speaker=idx>=0?line.slice(0,idx):key;const body=idx>=0?line.slice(idx+1):line;
   return msg(speaker,body,'friend',speaker==='你');
 }).join('');
}
function visibleMoments(){
 return T('朋友圈').split('\n').filter(Boolean).map(line=>{
    const idx=line.indexOf('：');return {name:idx>=0?line.slice(0,idx).trim():'',text:idx>=0?line.slice(idx+1).trim():line};
 }).filter(x=>getPerson(x.name).friend && x.name);
}
function render(){document.body.dataset.theme=state.theme;
 document.querySelector('#home-gesture').classList.toggle('light', ['intro','warning','chapter','scene'].includes(state.page)||state.page==='home'&&state.theme==='dark');

 if(state.page==='notes'){view.innerHTML=`${header('备忘录','home')}<div class="scroll"><button class="note-row" onclick="go('note-detail')"><strong>${E('备忘录标题')}</strong><p>${E('备忘录摘要')}</p></button><button class="note-row" onclick="go('clues')"><strong>奇怪的事情</strong><p>线索 ${state.clues} 条</p></button></div>`;return}
 if(state.page==='clues'){view.innerHTML=`${header('奇怪的事情','notes')}<div class="scroll"><div class="doc-section"><div class="doc-content">${state.checked?E('备忘录线索'):'暂时没有记录。'}</div></div></div>`;return}
 if(state.page==='settings'){view.innerHTML=`${header('设置','home')}<div class="scroll settings-scroll"><div class="settings-section"><h3>外观</h3><p class="settings-subtitle">切换手机界面的显示模式</p><div class="theme-toggle" role="group" aria-label="显示模式"><button class="theme-option ${state.theme==='light'?'selected':''}" aria-pressed="${state.theme==='light'}" onclick="setTheme('light')"><span class="theme-symbol">☀</span>浅色模式</button><button class="theme-option ${state.theme==='dark'?'selected':''}" aria-pressed="${state.theme==='dark'}" onclick="setTheme('dark')"><span class="theme-symbol">☾</span>深色模式</button></div></div><div class="settings-section"><h3>消息播放速度</h3><p class="settings-subtitle">${E('消息速度说明')}</p><div class="theme-toggle">${[[1000,'快速'],[2200,'正常'],[3600,'缓慢']].map(x=>`<button class="theme-option ${state.messageSpeed===x[0]?'selected':''}" onclick="setSpeed(${x[0]})">${x[1]}</button>`).join('')}</div></div><div class="settings-section"><h3>当前存档 · Day ${state.day}</h3><div class="info-row"><span>精神压力</span><span>${state.stress}/100</span></div><div class="info-row"><span>物业可信度</span><span>${state.trust}/100</span></div><div class="info-row"><span>已发现线索</span><span>${state.clues}</span></div></div><div class="settings-foot"><button class="restart-btn" onclick="reset()">重新开始 Day 1</button><p class="fineprint">显示模式会自动保存。数值与后续章节会在正式剧本中继续扩展。</p></div></div>`;return}
 const data={personal:['聊天',T('微信个人聊天'),'wechat'],moments:['朋友圈',T('朋友圈'),'wechat'],sms:['短信',T('短信'),'home'],phone:['电话',T('电话记录'),'home'],gallery:['相册',T('相册说明'),'home'], 'note-detail':[T('备忘录标题'),T('备忘录内容'),'notes'],repairs:['报事报修',T('报事报修'),'property']};
 const d=data[state.page]||['页面','内容将在正式版本中完善。','home'];view.innerHTML=`${header(d[0],d[2])}<div class="scroll"><div class="doc-section"><div class="doc-content">${clean(d[1])}</div></div></div>`;
 scheduleGroupNarrative(); scheduleNeighborNarrative();
}
function header(name,back){return `<div class="screen app-white"><header class="app-header"><button class="icon-btn" onclick="goBack()" aria-label="返回上一页">‹</button><h2>${name}</h2><div class="right-space"></div></header>`}
function msg(name,body,cls,mine=false){
  // All chat-avatar taps share the same WeChat profile & moments permissions as contacts.
  const personName=mine?'我':name;
  const iconHtml=personAvatar(personName);
  return `<div class="msg-row ${mine?'mine':''}"><button type="button" class="avatar-tap msg-avatar-btn" onclick="openPerson('${encodeURIComponent(personName)}')" aria-label="查看${clean(personName)}的资料">${iconHtml}</button><div class="msg-bubble-wrap">${mine?'':`<div class="msg-name">${clean(name)}</div>`}<div class="msg-bubble">${clean(body)}</div></div></div>`;
}
function chooseAvatar(i){
 state.avatar=i;store();
 document.querySelectorAll('.avatar-choice').forEach((btn,index)=>{
  btn.classList.toggle('selected',index+1===i);
  btn.setAttribute('aria-pressed',String(index+1===i));
 });
 validateProfile();
}
function updateProfile(){
 const input=document.querySelector('#profile-id');
 if(!input)return;
 state.profileDraft=input.value;
 validateProfile();
}
function validateProfile(){
 const field=document.querySelector('#profile-id');
 if(!field)return false;
 const id=field.value.trim();
 const count=Array.from(id).length;
 const okay=validId(id);
 const label=document.querySelector('#profile-tip');
 document.querySelector('#profile-count').textContent=`${count}/4`;
 label.classList.toggle('invalid',count>0&&!okay);
 label.textContent=count===0?'支持简体、繁体，最多 4 个汉字。':okay?'这个 ID 可以使用。':count>4?'ID 最多只能输入 4 个汉字。':'ID 只能使用中文汉字（支持繁体）。';
 document.querySelector('#profile-continue').disabled=!(okay&&state.avatar>=1&&state.avatar<=3);
 return okay;
}
function confirmProfile(){
 if(!validateProfile()){notify('请填写 1–4 个中文汉字的 ID');return}
 if(!state.avatar){notify('请先选择头像');return}
 state.playerId=document.querySelector('#profile-id').value.trim();
 state.profileDraft=state.playerId;
 store();go('chapter');
}
// The previous screen is recorded instead of hardcoding a return destination.
// This is important when the same announcement opens from chat, group info or the property app.
// Day 1 does not begin delivering messages until the player taps "查看手机".
function beginPhoneExperience(){
 cancelNarrative();
 clearTimeout(bannerTimer);
 const oldBanner=document.getElementById('incoming-banner');
 if(oldBanner)oldBanner.remove();
 Object.assign(state,{phoneActivated:true,phoneStartAt:Date.now(),stage:0,checked:false,reply:false,replyChoice:0,seenAnnouncement:false,yutongStage:0,groupReadStage:0,neighborReadStage:0,clues:0,stress:8,trust:70});
 store();
 go('home');
}
function go(p){
 const activeBanner=document.getElementById('incoming-banner');
 if(activeBanner && (p==='chat'||p==='neighbor')){activeBanner.remove();clearTimeout(bannerTimer)}
 if(state.page!==p){
  if(!Array.isArray(state.navStack))state.navStack=[];
  state.navStack.push(state.page);
  if(state.navStack.length>40)state.navStack.shift();
 }
 state.page=p;store();render();
 if(p==='chat')markGroupRead(); if(p==='neighbor')markNeighborRead(); scheduleGroupNarrative(); scheduleNeighborNarrative();
}
function goBack(){
 cancelNarrative();
 const previous=(Array.isArray(state.navStack)?state.navStack:[]).pop();
 state.page=previous||'home'; if(state.page==='chat')markGroupRead(); if(state.page==='neighbor')markNeighborRead(); store();render(); scheduleGroupNarrative(); scheduleNeighborNarrative();
}
function goHome(){state.navStack=[];state.page='home';store();render();scheduleGroupNarrative();scheduleNeighborNarrative()}
function setTheme(next){
 if(next!=='light'&&next!=='dark')return;
 state.theme=next;try{localStorage.setItem('resident_theme_set_v8','yes')}catch(e){}store();render();
}
function openApp(a){const pages={'微信':'wechat','相册':'gallery','电话':'phone','短信':'sms','备忘录':'notes','物业服务':'property','设置':'settings'};go(pages[a])}
function groupCount(){return T('群成员名单').split('\n').filter(Boolean).length}
function openAnnouncement(){state.seenAnnouncement=true;state.stage=Math.max(3,state.stage);cancelNarrative();store();go('rules');scheduleGroupNarrative()}
function finishGroup(){state.reply=true;state.replyChoice=0;state.stage=7;state.yutongStage=1;store();render(); if(!isViewingTarget('neighbor'))banner(T('王雨桐新消息1'),'王雨桐','neighbor'); scheduleNeighborNarrative()}
function replyNeighbor(choice){state.yutongReply=choice;state.yutongStage=3;store();render();scheduleNeighborNarrative()}
function setSpeed(v){state.messageSpeed=v;store();render();scheduleGroupNarrative();scheduleNeighborNarrative()}
function reply(choice){state.reply=true;state.replyChoice=choice;state.stage=7;state.yutongStage=1;store();render(); if(!isViewingTarget('neighbor'))banner(T('王雨桐新消息1'),'王雨桐','neighbor'); scheduleNeighborNarrative()}
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function reset(){cancelNarrative();clearTimeout(bannerTimer);document.getElementById('incoming-banner')?.remove();const theme=state.theme;Object.assign(state,defaultState,{navStack:[],theme,phoneActivated:false});store();render()}
document.querySelector('#home-gesture').addEventListener('click',goHome);
loadStory();

</script>
</body>
</html>
